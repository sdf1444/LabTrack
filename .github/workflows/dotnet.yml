name: LabTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci && npx playwright install --with-deps chromium && npm run check
        working-directory: src/LabTrack.Api/ClientApp
      - run: dotnet restore src/LabTrack.Api/LabTrack.Api.csproj
      - run: dotnet restore tests/LabTrack.Tests/LabTrack.Tests.csproj
      - run: dotnet format whitespace src/LabTrack.Api/LabTrack.Api.csproj --verify-no-changes --no-restore
      - run: dotnet format whitespace tests/LabTrack.Tests/LabTrack.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet build src/LabTrack.Api/LabTrack.Api.csproj --configuration Release --no-restore
      - run: dotnet test tests/LabTrack.Tests/LabTrack.Tests.csproj --configuration Release
