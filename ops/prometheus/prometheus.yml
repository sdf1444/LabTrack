global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: labtrack
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${LABTRACK_METRICS_TOKEN}
    static_configs:
      - targets: ["app:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
