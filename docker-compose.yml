services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labtrack
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: labtrack_dev
    ports:
      - "5432:5432"
    volumes:
      - labtrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtrack -d labtrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LabTrack: Host=db;Port=5432;Database=labtrack;Username=labtrack;Password=labtrack_dev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  labtrack-data:
