services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labtrack
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: ${LABTRACK_DB_PASSWORD:?Set LABTRACK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - labtrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtrack -d labtrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LabTrack: Host=db;Port=5432;Database=labtrack;Username=labtrack;Password=${LABTRACK_DB_PASSWORD:?Set LABTRACK_DB_PASSWORD in .env}
      LabTrack__BootstrapAdmin__Email: ${LABTRACK_ADMIN_EMAIL:?Set LABTRACK_ADMIN_EMAIL in .env}
      LabTrack__BootstrapAdmin__Password: ${LABTRACK_ADMIN_PASSWORD:?Set LABTRACK_ADMIN_PASSWORD in .env}
      LabTrack__Monitoring__MetricsToken: ${LABTRACK_METRICS_TOKEN:?Set LABTRACK_METRICS_TOKEN in .env}
      LabTrack__DataProtection__KeyPath: /var/lib/labtrack/dpkeys
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - labtrack-dpkeys:/var/lib/labtrack/dpkeys
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    environment:
      LABTRACK_METRICS_TOKEN: ${LABTRACK_METRICS_TOKEN:?Set LABTRACK_METRICS_TOKEN in .env}
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - labtrack-prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      app:
        condition: service_started
      postgres-exporter:
        condition: service_started

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_URI: db:5432/labtrack?sslmode=disable
      DATA_SOURCE_USER: labtrack
      DATA_SOURCE_PASS: ${LABTRACK_DB_PASSWORD:?Set LABTRACK_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - labtrack-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  labtrack-data:
  labtrack-dpkeys:
  labtrack-prometheus:
  labtrack-grafana:
